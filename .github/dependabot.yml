# Dependabot for egl-utils-js (generated by EADOS).
# Keeps GitHub Actions and language dependencies current. Each update opens a PR that goes
# through the normal review/CI flow — Dependabot proposes, the maintainer merges.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    labels: ["ci"]
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "build"
    labels: ["build"]
    # Deliberate pins — these majors are INCOMPATIBLE with this project's
    # constraints, not merely untried. Each was adopted once, broke the build,
    # and was reverted (PR #34, and again here); without these rules Dependabot
    # re-proposes them every week and a routine merge silently breaks `main`.
    # Removing an entry is a real decision: re-verify the reason first, and
    # expect to update the toolchain alongside it.
    ignore:
      # eslint >= 10 requires Node >= 20.19, dropping the Node 18 floor the CI
      # matrix and `engines` both declare (spec §1.1, NFR-07). See PR #8.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@eslint/js"
        update-types: ["version-update:semver-major"]
      # TypeScript 7 is the native port; tsup's dts pipeline
      # (rollup-plugin-dts) crashes on it, emitting no .d.ts at all. The spec
      # floor is TS >= 5.0. See PR #11.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # @types/node must match the OLDEST supported runtime (Node 18), or
      # `tsc --noEmit` type-checks against APIs the floor does not have.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # pnpm 11 requires Node >= 22.13; vitest 4 requires Node >= 20.12 — both
      # break the Node 18 cell. See PR #6 and PR #7.
      - dependency-name: "vitest"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitest/coverage-v8"
        update-types: ["version-update:semver-major"]
