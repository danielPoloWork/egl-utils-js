# Dependabot for egl-utils-js (generated by EADOS).
# Keeps GitHub Actions and language dependencies current. Each update opens a PR that goes
# through the normal review/CI flow — Dependabot proposes, the maintainer merges.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    labels: ["ci"]
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "build"
    labels: ["build"]
    # Deliberate pins — these majors are INCOMPATIBLE with this project's
    # constraints, not merely untried. Each was adopted once, broke the build,
    # and was reverted (PR #34, and again here); without these rules Dependabot
    # re-proposes them every week and a routine merge silently breaks `main`.
    # Removing an entry is a real decision: re-verify the reason first, and
    # expect to update the toolchain alongside it. Four were removed in 17.2
    # (`eslint`, `@eslint/js`, `vitest`, `@vitest/coverage-v8`, `jsdom`) because
    # their sole objection was the Node 18 floor, which ADR-0050 raised to 22.
    ignore:
      # TypeScript 7 is the native port; tsup's dts pipeline
      # (rollup-plugin-dts) crashes on it, emitting no .d.ts at all. The spec
      # floor is TS >= 5.0. See PR #11.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # @types/node must match the OLDEST supported runtime (Node 22 since 17.2,
      # ADR-0050), or `tsc --noEmit` type-checks against APIs the floor lacks.
      # The rule survives the floor raise; the version it points at moved.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # NFR-04 benchmark baselines (ADR-0013). These are pinned EXACTLY on
      # purpose: the nightly regression gate compares against them, so a
      # baseline that moves on its own invalidates every stored measurement.
      # Changing one is a deliberate re-baselining decision (regenerate
      # docs/benchmarks/baseline.json in the same PR), never a routine merge.
      # (Their Node-floor objection lapsed with 17.2; the baseline one is why
      # they are still here.)
      - dependency-name: "lodash"
      - dependency-name: "p-limit"
      - dependency-name: "p-retry"
