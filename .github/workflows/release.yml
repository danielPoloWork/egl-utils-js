name: release

# Release workflow for egl-utils-js, generated by EADOS.
# Fires on an annotated SemVer tag push and prepares a *draft* GitHub Release. Publishing is
# the deliberate human checkpoint (AGENTS.md §11 / docs/workflow/release.md) — this workflow
# never publishes, it only drafts so a maintainer can review and press "Publish".

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

# Serialize per-tag, but NEVER cancel an in-flight release — a half-run publish is worse
# than a queued one.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  draft-release:
    name: draft GitHub Release for ${{ github.ref_name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the tagged tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          # This job has no matrix; the expression it used to carry referenced a
          # non-existent `matrix.toolchain` and only worked by falling through to
          # its default. Same defect the benchmark job had in M1.4, missed here.
          node-version: '24'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build (verify the tag builds clean)
        shell: bash
        run: pnpm build

      # docs/workflow/release.md's boundary table has said "Build & attach
      # artifacts | CI" since M7 — this step is that promise, honoured (roadmap
      # 22.3, ADR-0087). The script both BUILDS the assets (the `npm pack`
      # tarball, the dist zip, SHA256SUMS) and GATES them: the zip's dist/**
      # must equal the tarball's, and every advertised path must be in both.
      # It also runs in the PR packaging job, so a tag is never its first run.
      - name: Build and verify the release assets (roadmap 22.3)
        shell: bash
        run: pnpm check:release-assets

      # release.md step 3 mandates hand-written notes at docs/releases/v<X.Y.Z>.md.
      # Fail loudly if they are missing rather than silently shipping only the
      # auto-generated PR list: an absent file means the release process was
      # skipped, which is exactly what a gate should refuse.
      - name: Require the hand-written release notes
        shell: bash
        run: |
          notes="docs/releases/${GITHUB_REF_NAME}.md"
          if [ ! -f "$notes" ]; then
            echo "::error::missing $notes — release.md step 3 requires it before tagging"
            exit 1
          fi
          echo "using $notes"

      - name: Draft the release (a human publishes it)
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          draft: true
          # The hand-written notes are the body; GitHub appends the generated
          # "What's Changed" PR list below them. Without body_path the prose
          # docs/releases/v<X.Y.Z>.md file was written but never consumed —
          # the v0.1.0 draft came out as a bare 61-item PR list.
          body_path: docs/releases/${{ github.ref_name }}.md
          generate_release_notes: true
          # The verified assets from the step above (roadmap 22.3, ADR-0087):
          # the registry's own tarball, the dist zip for download-and-link
          # consumers, and their checksums. Named explicitly rather than as
          # `release-assets/*` so an unexpected file in that directory can
          # never ride along into a release.
          files: |
            release-assets/egl-utils-js-*.tgz
            release-assets/egl-utils-js-*-dist.zip
            release-assets/SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
