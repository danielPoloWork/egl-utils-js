name: ci

# Enterprise CI gate for egl-utils-js, generated by EADOS.
# Implements the quality bar in AGENTS.md §10 across the toolchain matrix from the
# language profile. The build/test/format/lint commands come from project.yaml; the
# setup steps and language-specific extra jobs come from the profile.

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

# Cancel superseded runs on a PR; never cancel a run on main (its history matters).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ---------------------------------------------------------------------------
  # Cross-platform build + test matrix (from the language profile).
  # ---------------------------------------------------------------------------
  build:
    name: build / ${{ matrix.os }} / ${{ matrix.toolchain }} / ${{ matrix.preset }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, toolchain: node-22, preset: default }
          - { os: ubuntu-24.04, toolchain: node-24, preset: default }
          - { os: ubuntu-24.04, toolchain: node-26, preset: default }
    steps:
      - name: Check out the source tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@v6
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.toolchain == 'node-22' && '22' || matrix.toolchain == 'node-26' && '26' || '24' }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        shell: bash
        run: pnpm build

      # `pnpm coverage` = vitest run --coverage: runs the full suite AND
      # enforces the NFR-03 thresholds (>= 95% lines/branches) from
      # vitest.config.js on every Node cell of the matrix (roadmap 2.6).
      # Timing gates (*.redos.test.js) are excluded there and run separately,
      # UN-instrumented — coverage instrumentation would time itself.
      - name: Test (coverage gate >= 95%)
        shell: bash
        run: pnpm coverage

      - name: ReDoS gate (NFR-05, un-instrumented)
        shell: bash
        run: pnpm test:redos

  # ---------------------------------------------------------------------------
  # Cross-artifact congruence — the agent-runnable consistency lint.
  # ---------------------------------------------------------------------------
  consistency:
    name: consistency / lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0          # i18n/version checks need full history
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Run the consistency lint
        run: python tools/consistency_lint.py

      # The consistency lint holds version.js, the README badge, the changelog
      # and the release notes in lockstep with each other, but it never reads
      # package.json — and `changeset version` bumps package.json and nothing
      # else. Without this check the two could diverge silently (ADR-0016).
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Check package.json version is in lockstep
        run: node tools/sync-version.mjs --check

      # API docs must build without warnings (AGENTS.md quality bar). typedoc.json
      # sets treatWarningsAsErrors, so any undocumented/unresolved public symbol
      # fails this step rather than shipping silently broken reference docs.
      # Needs node_modules — sync-version above did not, being dependency-free.
      - name: Install dependencies (lockfile only)
        run: pnpm install --frozen-lockfile
      - name: Build the API reference (must be warning-free)
        run: pnpm docs:api

      # NFR-07 platform-API floor (roadmap 8.1, ADR-0017). Playwright runs one
      # recent build per engine and can never catch an old-Safari-only gap —
      # which is how AbortSignal.timeout (Safari 16.0) shipped against a
      # declared 15.4 floor for six milestones. This checks every platform API
      # the source touches against MDN browser-compat-data, deny-by-default.
      - name: Check the platform-API support floor
        run: pnpm check:api-floor

  # ---------------------------------------------------------------------------
  # Language-specific quality jobs (format, lint, sanitizers, …) from the profile.
  # ---------------------------------------------------------------------------
  lint:
    name: lint / eslint + prettier
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@v6
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with: { node-version: '24', cache: pnpm }
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # Invoke the package.json scripts so CI and local runs stay congruent
      # (single source of truth). `lint` is eslint --max-warnings 0 followed by
      # tsc --noEmit — the JSDoc checkJs type-soundness gate.
      - name: Check formatting
        run: pnpm format:check
      - name: Lint and type-check
        run: pnpm lint

  # Publishing gates — validate the built package's exports map, types
  # resolution, bundle budgets, tree-shakeability, and dependency policy
  # (NFR-01/02/06). Single-job on the Active LTS: these tools validate the built
  # artifact (Node-version-independent), while the library's own runtime floor
  # (Node >= 22, ADR-0050) is verified by the build/test matrix above.
  packaging:
    name: packaging / exports + budgets
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@v6
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Validate package publishing config (publint)
        run: pnpm check:publint
      - name: Validate types resolution across the exports map (arethetypeswrong)
        run: pnpm check:exports
      - name: Enforce bundle-size budgets (NFR-01)
        run: pnpm size
      - name: Assert tree-shakeability (NFR-02)
        run: pnpm check:shakeable
      - name: Assert zero runtime dependencies (NFR-06)
        run: pnpm check:deps

  # Reproducible performance gate — runs only when the project has a benchmark suite.
  benchmark:
    name: benchmark / reproducible perf
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@v6
      - name: Set up Node.js
        uses: actions/setup-node@v7
        # Single-job (no matrix): benchmarks run on one Node to keep baselines
        # comparable. The real suite lands with roadmap 7.1.
        with:
          node-version: '24'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run the benchmark suite
        shell: bash
        run: pnpm bench



  # Supply-chain gate (roadmap 7.4, NFR: spec §7). Two halves:
  #  - `--frozen-lockfile` proves the lockfile is complete and unchanged, so
  #    every job in this workflow builds the dependency tree that was reviewed
  #    rather than one resolved fresh at install time;
  #  - `pnpm audit --audit-level moderate` fails on a moderate advisory or worse.
  # Lowered from `high` in 17.11 (ADR-0051): the threshold has to see a moderate
  # advisory on the sanitizer's peer, which is the one dependency where a finding
  # can change this library's own code. Dev-only noise is fixed with a pnpm
  # override rather than excepted, the ADR-0026 precedent; `pnpm.auditConfig`
  # holds no exception today. Note this job can go red because the world changed,
  # not because a PR did; that is the point of a supply-chain gate.
  supply-chain:
    name: supply-chain / lockfile + audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@v6
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
      - name: Install from the lockfile only (fails if it is stale or incomplete)
        run: pnpm install --frozen-lockfile
      - name: Audit for moderate advisories and worse
        run: pnpm audit --audit-level moderate

  # Real-browser verification for the browser-leaning entries (roadmap 6.4,
  # spec §6). Its own job rather than a matrix cell: the browser download makes
  # this the slowest step in the workflow, and it verifies engines rather than
  # Node versions. (Until 17.2 it was also kept off the matrix because
  # @playwright/test needs Node >= 20 and the floor was 18; the floor is now 22.)
  browser:
    name: browser / storage + cookie + sanitize
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@v6
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install browsers (Chromium, Firefox, WebKit)
        run: pnpm test:browser:install
      # The suite loads dist/, so the artifact consumers download is what gets
      # verified — not the sources.
      - name: Build
        run: pnpm build
      - name: Run the browser smoke suite
        run: pnpm test:browser
      - name: Upload the Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
