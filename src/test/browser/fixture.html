<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>egl-utils-js browser smoke fixture</title>
    <!--
      The browser smoke suite (roadmap 6.4) loads the BUILT bundles from dist/,
      not the sources: what a consumer actually downloads is what gets checked.

      THERE IS NO IMPORT MAP, and that absence is now an assertion. Until
      roadmap 17.6 the /sanitize bundle carried a bare `dompurify` specifier and
      this fixture needed a map to resolve it — which is precisely the failure
      spec 05 F82 exists to remove: a browser with no bundler and no map could
      not load the entry at all. ADR-0055 made the peer a value looked up at
      first use, so every entry below now resolves with no map, exactly as a
      plain HTML page would.

      DOMPurify is supplied the way that page would supply it: a classic script
      that leaves the bound instance on `window.DOMPurify`, which is the ambient
      half of the ADR-0055 contract. The suite's own peer-absence assertions run
      in Node (sanitize-peer.test.js); the three-engine no-bundler proof is
      roadmap 18.1.
    -->
    <script src="/node_modules/dompurify/dist/purify.min.js"></script>
  </head>
  <body>
    <div id="host"></div>
    <!--
      Bootstrap's own bundle is deliberately NOT loaded here. The fixture must
      stay peer-free, because one of the assertions it serves is that the entry
      and its builders work with no `bootstrap` global at all (NFR-18, roadmap
      14.1). The behaviour suites that need the peer inject the bundle
      themselves, per test — which is also the honest shape of the F68 ambient
      case: a page that loaded Bootstrap, next to pages that did not.
    -->
    <script type="module">
      // Expose the built entries on `window` so Playwright's page.evaluate can
      // drive them. Errors are captured rather than thrown so a failed import
      // surfaces as a readable assertion instead of a blank page.
      window.__eglReady = (async () => {
        try {
          const [root, storage, sanitize, errors, logging, table, dom, bootstrap, ui, forms] =
            await Promise.all([
              import('/dist/esm/index.js'),
              import('/dist/esm/storage.js'),
              // No import map, no bundler: /sanitize resolves because it carries
              // no bare specifier any more (ADR-0055, spec 05 F82).
              import('/dist/esm/sanitize.js'),
              import('/dist/esm/errors.js'),
              import('/dist/esm/logging.js'),
              import('/dist/esm/table.js'),
              import('/dist/esm/dom.js'),
              // /bootstrap carries no bare specifier: the `bootstrap` peer is for
              // behaviours (M16), and the builders need only a document. That the
              // import resolves with no import-map entry is itself the NFR-18
              // assertion.
              import('/dist/esm/bootstrap.js'),
              // The application-UX entry (spec 07). It composes /bootstrap and
              // /dom internals, so its import graph is the widest on this page —
              // and it resolves with no import map either, which is the same
              // NFR-18 assertion one entry further out.
              import('/dist/esm/ui.js'),
              // The form engine (spec 08). Values only in 21.1; no peer, no component
              // library, and it resolves with no import map like every entry here.
              import('/dist/esm/forms.js'),
            ]);
          window.egl = {
            root,
            storage,
            sanitize,
            errors,
            logging,
            table,
            dom,
            bootstrap,
            ui,
            forms,
          };
          return { ok: true };
        } catch (error) {
          return { ok: false, message: String(error && error.message ? error.message : error) };
        }
      })();
    </script>
  </body>
</html>
